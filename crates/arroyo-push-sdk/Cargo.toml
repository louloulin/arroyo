[package]
name = "arroyo-push-sdk"
version = "0.1.0"
edition = "2021"
description = "SDK for Arroyo Push Connector"
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
base64 = "0.21"
