[package]
name = "arroyo-storage"
version = "0.15.0-dev"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = []

[dependencies]
arroyo-types = { path = "../arroyo-types" }
arroyo-rpc = { path = "../arroyo-rpc" }
bytes = "1.4.0"
tracing = "0.1"

aws-credential-types = "1.2.0"
aws-config = { workspace = true }
rand = { workspace = true }
object_store = {workspace = true, features = ["aws", "gcp"]}
regex = "1.9.5"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "time", "macros", "rt-multi-thread"] }
tokio-util = {version = "0.7.9", features = ["io"]}
async-trait = "0.1.73"
futures = "0.3.28"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lz4 = "1.24"
zstd = "0.12"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.8"
